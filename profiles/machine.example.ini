# machine.example.ini — 기계 프로파일 **템플릿**
#
#   python3 conical_slice.py model.stl --machine-profile profiles/machine.example.ini
#
# ⚠⚠ 이 파일의 값은 **우리 기계에서 확인된 것이 아니다.** 일반적인 FDM 프린터의
#    관례를 적어둔 출발점일 뿐이다. 실물 출력 전에 반드시:
#
#    1. 노즐·베드 온도를 쓸 재료에 맞춘다 (PLA 210/60, PETG 240/80 …)
#    2. G28 이 이 기계에서 맞는 호밍인지 확인한다.
#       **5축(Open5x)은 U/V 축 호밍이 따로 필요할 수 있다** — 아래 TODO 참조
#    3. 프라임 선의 좌표가 베드 안이고 출력물과 안 겹치는지 확인한다
#    4. 첫 실행은 노즐을 띄운 채(=베드에서 멀리) 한 번 돌려 동작만 본다
#
# 치환 가능한 키: 아래 [machine] 에 적은 값 전부 + 슬라이싱이 정한
#   {layer_height} {angle} {direction} {mode} {source_stl}

[machine]
name = TEMPLATE — 실기 확인 전

# --- 재료 ---
nozzle_temp = 210
bed_temp = 60
first_layer_nozzle_temp = 215

# --- 프라임 선 좌표 (베드 안인지 반드시 확인) ---
# 좌표계: 이 파이프라인은 **부품을 XY 원점(원뿔 축)에 놓는다.** 그래서 프라임 선은
#   원점에서 떨어진 곳이어야 한다. 예전 값 (5,5)→(100,5) 는 부품 한가운데를 지나가
#   첫 층이 그 위에 올라갔고, REP5X 의 출력 가능 반경 100mm 도 넘었다(2026-10-16).
#   아래 값: 앞쪽 y=−80 에서 x −40 → 40 (원점 거리 80~89mm) — 반경 77mm 이하
#   부품과 안 겹치고 REP5X 반경 100 안이다. conical_slice.py 가 매번 검사한다.
# ⚠ 기계 원점이 베드 **모서리**인 프린터(일반 3축)는 이 좌표가 베드 밖이다 —
#   그 경우엔 부품 위치부터 맞춰야 한다(지금 파이프라인은 원점 중앙 기계 기준).
prime_x0 = -40
prime_x1 = 40
prime_y = -80

# --- 부품 원점: 원뿔 축(부품 중심)이 놓일 베드 위 점, **기계 좌표** ---
# 경로는 언제나 원점(0,0) 둘레로 나온다. 시작 G-code 가 노즐을 이 점으로 옮긴 뒤
# `G92 X0 Y0` 으로 "여기가 (0,0)" 이라고 선언하므로, 경로·프라임 선이 통째로 이 점
# 기준이 된다 (경로 파일 자체는 그대로라 검사기들이 그대로 맞다).
#   · 원점이 베드 **중앙**인 기계 → 0, 0 (G92 X0 Y0 은 아무것도 안 바꾼다)
#   · 원점이 베드 **모서리**인 기계 → 베드 중앙 좌표 (예: 220×220 베드면 110, 110)
# ⚠ REP5X(RTCP 켜짐)에서 G92 XY 가 팁 좌표에 그대로 걸리는지는 **실기 확인 전**이다.
#   원점이 이미 중앙이면 0, 0 으로 두면 된다.
part_origin_x = 0
part_origin_y = 0

start_gcode =
    ; 원뿔 슬라이싱 출력 — {source_stl}, mode={mode}, 층고 {layer_height}
    M140 S{bed_temp}                ; 베드 예열 시작 (기다리지 않음)
    M104 S{first_layer_nozzle_temp} ; 노즐 예열 시작
    G21                             ; mm
    G90                             ; 절대 좌표
    M82                             ; 절대 E — 역변환이 절대 E 를 전제한다
    G28                             ; 호밍
    ; TODO(5축): U/V 축 호밍이 필요하면 여기에 넣는다. 기계마다 다르므로
    ;            제원을 확인하기 전에는 비워 둔다 — 틀린 호밍은 기계를 상하게 한다
    M190 S{bed_temp}                ; 베드 온도 도달까지 대기
    M109 S{first_layer_nozzle_temp} ; 노즐 온도 도달까지 대기
    G92 E0                          ; E 원점
    G1 Z5 F1200                     ; 띄운 채로 옮긴다
    G1 X{part_origin_x} Y{part_origin_y} F3000 ; 부품 원점(원뿔 축)으로
    G92 X0 Y0                       ; 여기를 XY 원점으로 — 경로가 이 점 둘레로 나온다
    G1 Z{layer_height} F1200
    G1 X{prime_x0} Y{prime_y} F3000 ; 프라임 선 시작점
    G1 X{prime_x1} Y{prime_y} E12 F1000   ; 프라임 선
    G92 E0                          ; 프라임 압출량은 본 출력에서 제외
    M104 S{nozzle_temp}             ; 첫 층 이후 온도로

end_gcode =
    M104 S0                         ; 노즐 끄기
    M140 S0                         ; 베드 끄기
    G91                             ; 상대 좌표
    G1 Z5 F1200                     ; 노즐을 출력물에서 띄운다
    G90                             ; 다시 절대 좌표
    ; TODO(5축): 틸트/회전 축을 0 으로 되돌릴지 정한다
    M84                             ; 모터 해제
