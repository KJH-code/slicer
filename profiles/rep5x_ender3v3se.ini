# rep5x_ender3v3se.ini — REP5X (Ender-3 V3 SE + REP5X 헤드-헤드 5축 키트, REP5X Marlin)
#
#   python3 conical_slice.py model.stl --mode rep5x \
#       --machine-profile profiles/rep5x_ender3v3se.ini
#   python3 rep5x_check.py model_rep5x.gcode
#
# 공식 REP5X 시작/종료 G-code(Vase Generator 의 Ender 3 V3 SE 기본값) 흐름을 따르되
# **우리 파이프라인에 맞게 세 군데를 바꿨다.** 근거는 docs/rep5x_machine_facts.md.
#
#   1. E 는 절대(M82). 공식은 M83(상대) 이지만 이 저장소의 역변환이 절대 E 를 전제한다.
#      그래서 종료 리트랙트도 `G92 E0` 뒤에 `G1 E-2` 다 — 공식의 `G91` + `G1 E-2` 를
#      그대로 쓰면 M82 에서는 E 를 **−2 까지 통째로 되감는다.**
#   2. 소프트 엔드스톱을 **끄지 않는다** (공식은 `M211 S0`). 라이브 TCP 에서 리밋은
#      IK **전의 팁 좌표**에 걸린다 — 팁 Z ≥ 0 이면 기울여도 잘리지 않으므로 출력을
#      방해하지 않고, 틀린 G-code 가 팁을 베드 아래로 보내는 것은 막아 준다.
#      이 기계에는 프로브도 Z-min 스위치도 없어서 **그게 유일한 보호다.**
#   3. TCP 전환(`G43.4`/`G49`)은 **B0 C0 에서만** 한다. 이 두 명령은 움직이지 않고
#      플래너 위치만 다시 쓰므로, 기운 채 전환하면 팁이 그만큼 어긋난다.
#      공식 종료 코드는 `G49` 를 회전축 복귀보다 먼저 하는데, 여기서는 순서를 바꿨다.
#
# ⚠⚠ **[실기 확인]** 이 붙은 값은 소스에서 읽었을 뿐 우리 기계에서 확인하지 않았다.
#    첫 실행은 필라멘트를 빼고 노즐을 띄운 채(Z 오프셋을 크게 주고) 동작만 볼 것.
#    출력 전에 `M503` `M665` `M211` `M119` 로 펌웨어 값을 대조한다.
#
# ⚠ 이동 줄(G0/G1)에는 **주석을 붙이지 않는다.** M668(SD 전처리)은 이동 줄의 주석 속
#    글자도 좌표로 읽는다 (`z0.6` → Z). 설명은 전부 따로 줄을 냈다.
#    `rep5x_check.py` 가 이 형식을 검사한다.
#
# 치환 가능한 키: 아래 [machine] 에 적은 값 전부 + 슬라이싱이 정한
#   {layer_height} {angle} {direction} {mode} {source_stl}
# (INI 자체의 주석은 `#`, G-code 주석은 `;` 다. 퍼센트 기호는 쓰지 말 것.)

[machine]
name = REP5X Ender-3 V3 SE (REP5X Marlin) — [실기 확인] 전

# --- 재료 (PLA 기준) ---
nozzle_temp = 210
bed_temp = 60
first_layer_nozzle_temp = 215

# --- 부품 원점: 원뿔 축이 놓일 베드 위 점, **native 좌표** ---
# native X0 Y0 은 베드 **모서리**다 (BED_CENTER_AT_0_0 꺼짐). 경로는 원점(0,0) 둘레로
# 나오므로, 시작 G-code 가 이 점으로 가서 `G92 X0 Y0` 으로 "여기가 (0,0)" 이라고
# 선언한다. 200×200 베드라면 중앙은 (100, 100) 이다.  [실기 확인]
# ⚠ 모서리를 원점으로 두면(0, 0) 부품의 절반이 native X<0 이 된다. 라이브 TCP 에서
#   native [0,200]×[−40,200] 밖의 회전 이동은 **조용히 버려진다.**
part_origin_x = 100
part_origin_y = 100

# --- 프라임 선: **native 좌표**, B0 C0, TCP 꺼진 상태 ---
# 베드 앞쪽 y=5 에서 x 20 → 120. 부품 원점(100,100)에서 95mm 떨어져 있어 반경 90mm
# 이하 부품과 안 겹친다. `conical_slice.py` 가 매번 검사한다.  [실기 확인: 베드 안인가]
prime_x0 = 20
prime_x1 = 120
prime_y = 5
prime_z = 0.3
prime_e = 12

# --- 높이 ---
# travel_z : 프라임 전후로 띄우는 높이
# start_z  : TCP 를 켜는 높이. 헤드가 이 자리에서 첫 자세로 기울므로 넉넉해야 한다
#            (뷰어 모델 기준 B=45° 에서 몸체가 팁보다 4.4mm, 60° 에서 9.8mm 내려온다)
# end_lift : 출력이 끝나고 팁을 올리는 높이 (상대)
travel_z = 5
start_z = 15
end_lift = 10

# --- 냉각 (권장값 — **자동으로 걸리지 않는다**) ---
# 시험 출력물이 작아서(lamp_small 지름 9.6mm) 층 하나가 몇 초에 끝난다. PLA 는 앞 층이
# 굳을 시간이 필요하다. 아래는 `conical_slice.py` 에 직접 줄 값이다:
#
#     --min-layer-time 8 --min-print-speed 10 --fan
#
# 여기 적어 두기만 하고 슬라이서가 읽어서 걸지는 않는다 — 걸면 같은 명령으로 다시 뽑은
# 파일이 달라진다(시험 사다리 `examples/rep5x_ladder/` 재현). 층이 이보다 짧으면
# `conical_slice.py` 가 한 줄로 알려 준다.
# ⚠ lamp_small 22° 는 속도 하한 10mm/s 에 걸려 65층 중 55층이 8초를 못 채운다 (경로가
#   층당 40mm 안팎). 하한을 내리면(예 `--min-print-speed 5`) 채우지만 느린 압출은
#   실이 흘러나온다 — [실기 확인]. 회전축 상한(`--omega-max`)이 이미 F 를 깎고 있어서
#   이 기계의 실제 층 시간은 변환공간 추정보다 길다 (lamp_small 22°: 중앙 7.3초).
# `--fan` 은 처음 2층 뒤에 M106 S255 를 낸다(끝에 M106 S0). ⚠ 조립 안내서에 슬립링이
# 나르는 것은 hotend fan·히터·서미스터·B 엔드스톱뿐이다 (conical/rep5x.py 머리말) —
# **파트 냉각 팬이 달려 있는지, M106 이 그 팬을 돌리는지부터 [실기 확인].** 없으면
# 이 줄은 아무 일도 하지 않고, 냉각은 층 시간으로만 번다.
recommended_min_layer_time = 8
recommended_min_print_speed = 10

start_gcode =
    ; conical slicing for REP5X (Ender-3 V3 SE) - {source_stl}, mode={mode}, layer {layer_height}
    ; --- TCP 끄기. 부팅 기본값이 config 마다 엇갈리므로 항상 밝힌다. 호밍은 G49 상태에서 한다
    G49
    ; 보정(M667)도 호밍 동안 끈다 - 공식 흐름  [실기 확인]
    M667 S0
    G21
    G90
    ; 절대 E. 공식 흐름은 M83 이지만 이 저장소의 역변환은 절대 E 를 전제한다
    M82
    M220 S100
    M221 S100
    M140 S{bed_temp}
    M104 S{first_layer_nozzle_temp}
    ; --- 호밍: X 먼저, 그다음 전부. G28 은 X Y Z C B 를 다 호밍한다
    G28 X
    G28
    ; B 홈은 -135 도다. 여기서 0 으로 되돌리지 않으면 기운 채 출력이 시작된다
    G0 C0 B0 F3000
    ; 소프트 엔드스톱을 켜 둔다 (공식 흐름의 M211 S0 을 쓰지 않는다 - 파일 머리말 2번)
    M211 S1
    M190 S{bed_temp}
    ; --- 프라임 선: native 좌표, B0 C0, TCP 꺼짐
    G92 E0
    G1 Z{travel_z} F3000
    G1 X{prime_x0} Y{prime_y} F3000
    M109 S{first_layer_nozzle_temp}
    G1 Z{prime_z} F600
    G1 X{prime_x1} Y{prime_y} E{prime_e} F1000
    G92 E0
    G1 Z{start_z} F3000
    ; --- 부품 원점(베드 중앙 native)으로 가서 XY 원점과 회전축 0 을 선언한다  [실기 확인]
    G0 X{part_origin_x} Y{part_origin_y} F2400
    G92 X0 Y0 C0 B0
    ; --- TCP 켜기: B0 C0 인 지금만 안전하다. 이 뒤로 X Y Z 는 노즐 팁이다
    G43.4
    ; 보정 데이터를 넣은 뒤에만 켤 것: M667 S1  [실기 확인]
    ; 회전축 저크를 낮춘다 - 공식 흐름  [실기 확인]
    M205 I2 J2
    M104 S{nozzle_temp}

end_gcode =
    ; --- 리트랙트. 절대 E 라 G92 E0 뒤에 E-2 다 (파일 머리말 1번)
    G92 E0
    G1 E-2 F2700
    ; --- TCP 를 켠 채 팁을 수직으로 올린다
    G91
    G1 Z{end_lift} F1200
    G90
    ; --- 회전축을 0 으로. 회전만 하는 이동이라 F 는 도/분이다 (1800 = 30도/초)
    G0 B0 C0 F1800
    ; --- TCP 끄기: B0 C0 인 지금만 안전하다
    G49
    M667 S0
    ; --- Z 를 위로 호밍한다 (Z 홈은 MAX). G49 뒤라서 된다
    G28 Z
    G4 P1000
    M106 S0
    M104 S0
    M140 S0
    ; Z 모터는 켜 둔다. 끄면 헤드 무게로 Z 가 흘러내릴 수 있다
    ; 펌웨어의 DISABLE_IDLE_Z (120초)가 그래도 끌 수 있으니 출력물을 바로 꺼낼 것  [실기 확인]
    M84 X Y E C B
