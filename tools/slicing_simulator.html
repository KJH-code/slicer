<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>conical slicing 시뮬레이터</title>
  <!--
    팀메의 3d_graph.html (Excel 3D 표면 비교)을 확장한 버전.
    원본 기능(모드 1)은 그대로 두고, G-code 실행 시뮬레이터(모드 2)를 추가:
      · conical_slice.py 출력(.gcode)을 로드해 툴패스를 3D로 표시
      · 재생/일시정지/속도/진행 슬라이더로 '실행 과정'을 애니메이션
      · 색: 높이 / 원뿔 레이어(z+r·tanθ) / 피드 / V회전각
      · Open5x G-code는 기계좌표 그대로 or 부품좌표 복원(역기구학) 표시
  -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020; --panel: #151c2f; --border: #2b3655;
      --text: #eef2ff; --muted: #aab4d0; --accent: #6ea8fe;
      --danger: #ff8a8a; --warning: #ffd27a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text); }
    .app { --controls-width: 370px;
      display: grid;
      grid-template-columns: var(--controls-width) 7px minmax(0, 1fr);
      min-height: 100vh; }
    .controls { padding: 20px; background: var(--panel); overflow-y: auto; min-width: 0; }
    h1 { margin: 0 0 8px; font-size: 1.2rem; }
    .field { margin-bottom: 16px; }
    .field label, .field-title { display: block; margin-bottom: 7px; font-weight: 650; font-size: 0.92rem; }
    input[type="file"], select, input[type="range"] { width: 100%; }
    input[type="file"], select, input[type="number"] {
      padding: 9px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg); color: var(--text); }
    input[type="number"] { width: 90px; }
    .check-row { display: flex; align-items: center; gap: 9px; margin: 8px 0; }
    .check-row input { width: 17px; height: 17px; flex: 0 0 auto; }
    .range-value { color: var(--accent); font-variant-numeric: tabular-nums; }
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .mode-tabs button {
      flex: 1; padding: 10px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg); color: var(--muted); cursor: pointer; font-weight: 650; }
    .mode-tabs button.active { background: var(--accent); color: #0b1020; border-color: var(--accent); }
    .file-list { display: grid; gap: 8px; }
    .file-item { display: grid; grid-template-columns: auto 12px minmax(0,1fr);
      align-items: center; gap: 9px; padding: 9px 10px;
      border: 1px solid var(--border); border-radius: 9px;
      background: rgba(255,255,255,0.025); }
    .file-item input { width: 16px; height: 16px; }
    .file-color { width: 12px; height: 12px; border-radius: 3px; }
    .file-name { min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-size: 0.88rem; }
    .data-format, .status, .sim-stats {
      padding: 12px; border: 1px solid var(--border); border-radius: 10px;
      background: rgba(255,255,255,0.03); color: var(--muted);
      font-size: 0.86rem; line-height: 1.55; }
    .status { min-height: 46px; margin-top: 14px; white-space: pre-wrap; }
    .status.error { color: var(--danger); border-color: rgba(255,138,138,0.55); }
    .sim-stats { font-variant-numeric: tabular-nums; white-space: pre-wrap; }
    .play-row { display: flex; gap: 8px; align-items: center; }
    .play-row button {
      padding: 9px 16px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg); color: var(--text); cursor: pointer; font-weight: 700; }
    .play-row button.playing { background: var(--accent); color: #0b1020; }
    .play-row select { width: auto; }
    .chart-wrap { min-width: 0; min-height: 100vh; position: relative; }
    .sidebar-resizer { position: relative; width: 7px; min-height: 100vh;
      cursor: col-resize; background: var(--border); touch-action: none; transition: background .15s; }
    .sidebar-resizer:hover, .sidebar-resizer.dragging { background: var(--accent); }
    .sidebar-resizer::after { content: ""; position: absolute; inset: 0 -4px; }
    body.resizing-sidebar { cursor: col-resize; user-select: none; }
    #chart { width: 100%; height: 100vh; }
    @media (max-width: 800px) {
      .app { grid-template-columns: 1fr; }
      .chart-wrap, #chart { min-height: 72vh; height: 72vh; }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="controls">
      <h1>conical slicing 시뮬레이터</h1>

      <div class="mode-tabs">
        <button id="tabExcel" class="active">Excel 표면 비교</button>
        <button id="tabGcode">G-code 실행</button>
      </div>

      <!-- ───────── 모드 1: Excel 표면 비교 (원본 그대로) ───────── -->
      <div id="excelPanel">
        <div class="field">
          <label for="excelFiles">Excel 파일 여러 개 선택</label>
          <input id="excelFiles" type="file" accept=".xlsx,.xls,.xlsm,.xlsb" multiple />
        </div>
        <div class="field">
          <label for="sheetSelect">비교할 시트</label>
          <select id="sheetSelect" disabled><option>Excel 파일을 먼저 선택하세요</option></select>
        </div>
        <div id="fileListField" class="field" hidden>
          <span class="field-title">표시할 파일</span>
          <div id="fileList" class="file-list"></div>
        </div>
        <div class="field">
          <span class="field-title">표시 방식</span>
          <label class="check-row"><input id="showSurface" type="checkbox" checked /><span>표면 표시</span></label>
          <label class="check-row"><input id="showGrid" type="checkbox" checked /><span>격자선 표시</span></label>
          <label class="check-row"><input id="showPoints" type="checkbox" /><span>격자점 표시</span></label>
        </div>
        <div class="field">
          <label for="surfaceOpacity">각 표면 투명도: <span id="opacityValue" class="range-value">0.56</span></label>
          <input id="surfaceOpacity" type="range" min="0" max="1" step="0.02" value="0.56" />
        </div>
        <div class="field">
          <label for="zVisualScale">z축 시각 배율: <span id="zScaleValue" class="range-value">1.00×</span></label>
          <input id="zVisualScale" type="range" min="0.1" max="10" step="0.1" value="1" />
        </div>
        <div class="data-format">
          <strong>각 시트의 데이터 위치</strong><br />
          x = κ<sub>max</sub>: B4, C4, D4, ...<br />
          y = q<sub>0</sub>: A5, A6, A7, ...<br />
          z: B5부터 시작하는 행렬
        </div>
      </div>

      <!-- ───────── 모드 2: G-code 실행 시뮬레이터 (신규) ───────── -->
      <div id="gcodePanel" hidden>
        <div class="field">
          <label for="gcodeFile">G-code 파일 (.gcode)</label>
          <input id="gcodeFile" type="file" accept=".gcode,.gco,.g,.txt" />
        </div>

        <div class="field">
          <span class="field-title">재생</span>
          <div class="play-row">
            <button id="playBtn">▶ 재생</button>
            <select id="playSpeed">
              <option value="10">느리게</option>
              <option value="60" selected>보통</option>
              <option value="300">빠르게</option>
              <option value="1500">매우 빠르게</option>
            </select>
          </div>
          <label style="margin-top:10px" for="progress">진행:
            <span id="progressValue" class="range-value">0%</span></label>
          <input id="progress" type="range" min="0" max="1000" step="1" value="1000" />
        </div>

        <div class="field">
          <label for="colorMode">색상 기준</label>
          <select id="colorMode">
            <option value="cone" selected>원뿔 레이어 (z + r·tanθ)</option>
            <option value="z">실제 높이 z</option>
            <option value="feed">피드레이트 F</option>
            <option value="v">V 회전각 (Open5x)</option>
          </select>
        </div>

        <div class="field">
          <span class="field-title">표시</span>
          <label class="check-row"><input id="showTravel" type="checkbox" /><span>이동(비압출) 경로</span></label>
          <label class="check-row"><input id="showHead" type="checkbox" checked /><span>현재 노즐 위치</span></label>
          <label class="check-row"><input id="partFrame" type="checkbox" checked /><span>Open5x → 부품좌표 복원(역기구학)</span></label>
        </div>

        <div class="field">
          <label>Open5x 파라미터 (부품좌표 복원용)</label>
          <div style="display:flex; gap:10px; align-items:center; color:var(--muted); font-size:0.88rem">
            pivot <input id="pivotDepth" type="number" value="50" step="1" /> mm
          </div>
        </div>

        <div class="sim-stats" id="simStats">G-code 파일을 선택하세요.
conical_slice.py 출력(_conical.gcode / _open5x.gcode)을 그대로 읽습니다.</div>
      </div>

      <div id="status" class="status" aria-live="polite">준비됨.</div>
    </section>

    <div id="sidebarResizer" class="sidebar-resizer"></div>
    <section class="chart-wrap"><div id="chart"></div></section>
  </main>

  <script>
    "use strict";

    // ═══════════ 공통 (원본 유지) ═══════════
    const chart = document.getElementById("chart");
    const statusBox = document.getElementById("status");
    const app = document.querySelector(".app");
    const sidebarResizer = document.getElementById("sidebarResizer");
    const PALETTE = ["#56B4E9","#E69F00","#009E73","#CC79A7","#F0E442",
                     "#0072B2","#D55E00","#8F8FFF","#7BC96F","#FF8DA1"];
    function setStatus(msg, kind = "normal") {
      statusBox.textContent = msg;
      statusBox.classList.toggle("error", kind === "error");
    }
    // 사이드바 리사이저 (원본 그대로)
    let resizingSidebar = false, resizeFrame = null;
    function setControlsWidth(clientX) {
      const rect = app.getBoundingClientRect();
      const w = Math.max(260, Math.min(clientX - rect.left, Math.min(700, rect.width * 0.7)));
      app.style.setProperty("--controls-width", `${w}px`);
      if (resizeFrame !== null) cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => { Plotly.Plots.resize(chart); resizeFrame = null; });
    }
    sidebarResizer.addEventListener("pointerdown", e => {
      resizingSidebar = true; sidebarResizer.classList.add("dragging");
      document.body.classList.add("resizing-sidebar");
      sidebarResizer.setPointerCapture(e.pointerId); e.preventDefault(); });
    sidebarResizer.addEventListener("pointermove", e => { if (resizingSidebar) setControlsWidth(e.clientX); });
    function finishResize(e) {
      if (!resizingSidebar) return;
      resizingSidebar = false; sidebarResizer.classList.remove("dragging");
      document.body.classList.remove("resizing-sidebar");
      if (sidebarResizer.hasPointerCapture(e.pointerId)) sidebarResizer.releasePointerCapture(e.pointerId);
      Plotly.Plots.resize(chart); }
    sidebarResizer.addEventListener("pointerup", finishResize);
    sidebarResizer.addEventListener("pointercancel", finishResize);

    // ═══════════ 모드 전환 ═══════════
    const tabExcel = document.getElementById("tabExcel");
    const tabGcode = document.getElementById("tabGcode");
    const excelPanel = document.getElementById("excelPanel");
    const gcodePanel = document.getElementById("gcodePanel");
    let mode = "excel";
    function switchMode(m) {
      mode = m;
      tabExcel.classList.toggle("active", m === "excel");
      tabGcode.classList.toggle("active", m === "gcode");
      excelPanel.hidden = m !== "excel";
      gcodePanel.hidden = m !== "gcode";
      Plotly.purge(chart);
      if (m === "excel") { drawEmptyPlot(); if (datasets.length) renderPlot(); }
      else { drawEmptyGcodePlot(); if (sim.moves.length) renderSim(); }
    }
    tabExcel.addEventListener("click", () => switchMode("excel"));
    tabGcode.addEventListener("click", () => switchMode("gcode"));

    // ═══════════ 모드 1: Excel 표면 비교 (팀메 원본 로직 그대로) ═══════════
    const fileInput = document.getElementById("excelFiles");
    const sheetSelect = document.getElementById("sheetSelect");
    const fileListField = document.getElementById("fileListField");
    const fileList = document.getElementById("fileList");
    const showSurface = document.getElementById("showSurface");
    const showGrid = document.getElementById("showGrid");
    const showPoints = document.getElementById("showPoints");
    const opacityInput = document.getElementById("surfaceOpacity");
    const opacityValue = document.getElementById("opacityValue");
    const zScaleInput = document.getElementById("zVisualScale");
    const zScaleValue = document.getElementById("zScaleValue");
    let workbooks = [], datasets = [], sharedSheetNames = [], currentSheetName = "z";

    function isBlank(v) { return v === undefined || v === null || String(v).trim() === ""; }
    function toFiniteNumber(v, addr, fn) {
      if (typeof v === "number" && Number.isFinite(v)) return v;
      const n = Number(String(v).trim().replace(/,/g, ""));
      if (!Number.isFinite(n)) throw new Error(`${fn}: ${addr} 셀 "${v}" 숫자 해석 불가`);
      return n; }
    function normalizedSheetNames(wb) { return [...wb.SheetNames].sort((a,b)=>a.localeCompare(b,"ko")); }
    function arraysEqual(a,b){ return a.length===b.length && a.every((v,i)=>v===b[i]); }
    function validateSameSheets(items) {
      if (!items.length) throw new Error("선택한 파일이 없습니다.");
      const ref = normalizedSheetNames(items[0].workbook); const bad = [];
      for (let i=1;i<items.length;i++) {
        const cand = normalizedSheetNames(items[i].workbook);
        if (!arraysEqual(ref,cand)) bad.push(items[i].fileName);
      }
      if (bad.length) throw new Error(`시트 구성이 다른 파일: ${bad.join(", ")}`);
      return items[0].workbook.SheetNames; }
    function readGridFromSheet(sheet, fileName) {
      const range = XLSX.utils.decode_range(sheet["!ref"] || "A1:A1");
      const x = [];
      for (let c=1;c<=range.e.c;c++){ const a=XLSX.utils.encode_cell({r:3,c});
        const cell=sheet[a]; if(!cell||isBlank(cell.v))break; x.push(toFiniteNumber(cell.v,a,fileName)); }
      const y = [];
      for (let r=4;r<=range.e.r;r++){ const a=XLSX.utils.encode_cell({r,c:0});
        const cell=sheet[a]; if(!cell||isBlank(cell.v))break; y.push(toFiniteNumber(cell.v,a,fileName)); }
      if (x.length<2) throw new Error(`${fileName}: B4부터 x값 2개 이상 필요`);
      if (y.length<2) throw new Error(`${fileName}: A5부터 y값 2개 이상 필요`);
      const z = [];
      for (let j=0;j<y.length;j++){ const row=[];
        for (let i=0;i<x.length;i++){ const a=XLSX.utils.encode_cell({r:4+j,c:1+i});
          const cell=sheet[a]; row.push((!cell||isBlank(cell.v))?null:toFiniteNumber(cell.v,a,fileName)); }
        z.push(row); }
      return { x, y, z, validCount: z.flat().filter(Number.isFinite).length }; }
    function updateFileList() {
      fileList.innerHTML = "";
      datasets.forEach(ds => {
        const row = document.createElement("label"); row.className = "file-item";
        const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = ds.enabled;
        cb.addEventListener("change", () => { ds.enabled = cb.checked; renderPlot(); });
        const col = document.createElement("span"); col.className = "file-color"; col.style.background = ds.color;
        const nm = document.createElement("span"); nm.className = "file-name"; nm.textContent = ds.fileName;
        row.append(cb, col, nm); fileList.appendChild(row); });
      fileListField.hidden = datasets.length === 0; }
    function makeGridTraces(ds) {
      const traces = []; const visible = ds.enabled && showGrid.checked;
      const line = { color: ds.color, width: 4 };
      const push = (xs,ys,zs)=>traces.push({type:"scatter3d",mode:"lines",x:xs,y:ys,z:zs,
        line, hoverinfo:"skip", showlegend:false, visible});
      for (let j=0;j<ds.data.y.length;j++){
        const xs=[],ys=[],zs=[];
        for (let i=0;i<ds.data.x.length;i++){ const v=ds.data.z[j][i];
          xs.push(Number.isFinite(v)?ds.data.x[i]:null); ys.push(Number.isFinite(v)?ds.data.y[j]:null);
          zs.push(Number.isFinite(v)?v:null); }
        push(xs,ys,zs); }
      for (let i=0;i<ds.data.x.length;i++){
        const xs=[],ys=[],zs=[];
        for (let j=0;j<ds.data.y.length;j++){ const v=ds.data.z[j][i];
          xs.push(Number.isFinite(v)?ds.data.x[i]:null); ys.push(Number.isFinite(v)?ds.data.y[j]:null);
          zs.push(Number.isFinite(v)?v:null); }
        push(xs,ys,zs); }
      return traces; }
    function makePointTrace(ds) {
      const xs=[],ys=[],zs=[],text=[];
      for (let j=0;j<ds.data.y.length;j++) for (let i=0;i<ds.data.x.length;i++){
        const v=ds.data.z[j][i]; if(!Number.isFinite(v))continue;
        xs.push(ds.data.x[i]); ys.push(ds.data.y[j]); zs.push(v);
        text.push(`${ds.fileName}<br>κmax=${ds.data.x[i]}<br>q0=${ds.data.y[j]}<br>${currentSheetName}=${v}`); }
      return { type:"scatter3d", mode:"markers", x:xs,y:ys,z:zs, text,
        hovertemplate:"%{text}<extra></extra>", marker:{size:3.4,color:ds.color},
        name:ds.fileName, showlegend:false, visible: ds.enabled && showPoints.checked }; }
    function makeSurfaceTrace(ds, opacity) {
      return { type:"surface", x:ds.data.x, y:ds.data.y, z:ds.data.z, name:ds.fileName,
        opacity, colorscale:[[0,ds.color],[1,ds.color]], showscale:false,
        hovertemplate:`<b>${ds.fileName}</b><br>κmax=%{x}<br>q0=%{y}<br>${currentSheetName}=%{z}<extra></extra>`,
        visible: ds.enabled && showSurface.checked, showlegend:false }; }
    function makeLegendTrace(ds) {
      return { type:"scatter3d", mode:"markers", x:[null],y:[null],z:[null],
        marker:{size:8,color:ds.color}, name:ds.fileName, showlegend:true,
        hoverinfo:"skip", visible: ds.enabled }; }
    function renderPlot() {
      if (!datasets.length || mode !== "excel") return;
      const opacity = Number(opacityInput.value);
      const zs = Number(zScaleInput.value);
      opacityValue.textContent = opacity.toFixed(2);
      zScaleValue.textContent = `${zs.toFixed(2)}×`;
      const traces = [];
      datasets.forEach(ds => { traces.push(makeSurfaceTrace(ds, opacity));
        traces.push(...makeGridTraces(ds)); traces.push(makePointTrace(ds));
        traces.push(makeLegendTrace(ds)); });
      Plotly.react(chart, traces, {
        margin:{l:0,r:0,t:25,b:0}, paper_bgcolor:"#0b1020", plot_bgcolor:"#0b1020",
        font:{color:"#eef2ff"},
        legend:{x:0.01,y:0.99,bgcolor:"rgba(11,16,32,0.72)",bordercolor:"#2b3655",borderwidth:1},
        scene:{ aspectmode:"manual", aspectratio:{x:1,y:1,z:zs},
          xaxis:{title:{text:"κ<sub>max</sub>"},gridcolor:"#33405f",backgroundcolor:"#0b1020"},
          yaxis:{title:{text:"q<sub>0</sub>"},gridcolor:"#33405f",backgroundcolor:"#0b1020"},
          zaxis:{title:{text:currentSheetName},gridcolor:"#33405f",backgroundcolor:"#0b1020"},
          camera:{eye:{x:1.5,y:1.5,z:1.15}} },
        uirevision:"keep-camera" },
        { responsive:true, displaylogo:false, scrollZoom:true }); }
    function loadSelectedSheet() {
      if (!workbooks.length) return;
      try {
        currentSheetName = sheetSelect.value;
        datasets = workbooks.map((item,i)=>({ fileName:item.fileName,
          color:PALETTE[i%PALETTE.length], enabled:true,
          data:readGridFromSheet(item.workbook.Sheets[currentSheetName], item.fileName) }));
        updateFileList(); renderPlot();
        setStatus(`시트: ${currentSheetName} / 파일 ${datasets.length}개`);
      } catch (err) { datasets=[]; updateFileList(); Plotly.purge(chart); drawEmptyPlot();
        setStatus(err instanceof Error ? err.message : String(err), "error"); } }
    async function readWorkbookFile(file) {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:"array", cellDates:false, cellFormula:true });
      if (!wb.SheetNames.length) throw new Error(`${file.name}: 시트 없음`);
      return { fileName:file.name, workbook:wb }; }
    async function loadFiles() {
      const files = [...(fileInput.files || [])];
      if (!files.length) return;
      try {
        setStatus(`${files.length}개 Excel 읽는 중...`);
        const loaded = await Promise.all(files.map(readWorkbookFile));
        sharedSheetNames = validateSameSheets(loaded); workbooks = loaded;
        sheetSelect.innerHTML = "";
        sharedSheetNames.forEach(n => { const o=document.createElement("option");
          o.value=n; o.textContent=n; sheetSelect.appendChild(o); });
        sheetSelect.disabled = false; loadSelectedSheet();
      } catch (err) { setStatus(err instanceof Error ? err.message : String(err), "error"); } }
    function drawEmptyPlot() {
      Plotly.newPlot(chart, [], {
        margin:{l:0,r:0,t:25,b:0}, paper_bgcolor:"#0b1020", plot_bgcolor:"#0b1020",
        font:{color:"#eef2ff"},
        annotations:[{text:"왼쪽에서 파일을 선택하세요.",showarrow:false,
          font:{size:18,color:"#aab4d0"}}] }, { responsive:true, displaylogo:false }); }
    fileInput.addEventListener("change", loadFiles);
    sheetSelect.addEventListener("change", loadSelectedSheet);
    showSurface.addEventListener("change", renderPlot);
    showGrid.addEventListener("change", renderPlot);
    showPoints.addEventListener("change", renderPlot);
    opacityInput.addEventListener("input", renderPlot);
    zScaleInput.addEventListener("input", renderPlot);

    // ═══════════ 모드 2: G-code 실행 시뮬레이터 (신규) ═══════════
    const gcodeFile = document.getElementById("gcodeFile");
    const playBtn = document.getElementById("playBtn");
    const playSpeed = document.getElementById("playSpeed");
    const progress = document.getElementById("progress");
    const progressValue = document.getElementById("progressValue");
    const colorMode = document.getElementById("colorMode");
    const showTravel = document.getElementById("showTravel");
    const showHead = document.getElementById("showHead");
    const partFrame = document.getElementById("partFrame");
    const pivotDepth = document.getElementById("pivotDepth");
    const simStats = document.getElementById("simStats");

    const sim = { moves: [], meta: {}, playing: false, idx: 0, is5x: false };

    // conical_slice.py 의 메타/헤더에서 각도·방향·틸트 추출
    function parseGcodeText(text) {
      const moves = []; const meta = { angle: null, direction: null, tilt: null };
      let x=null,y=null,z=null,e=null,f=null,v=null,u=null;
      let ePrev = 0, len = 0, exLen = 0;
      const lines = text.split(/\r?\n/);
      for (let li = 0; li < lines.length; li++) {
        const raw = lines[li];
        const cm = raw.match(/;\s*conical:\s*angle=([\d.]+)\s+direction=(\w+)/);
        if (cm) { meta.angle = Number(cm[1]); meta.direction = cm[2]; }
        const tm = raw.match(/tilt\s+([A-Z])=(-?[\d.]+)deg/);
        if (tm) meta.tilt = Number(tm[2]);
        const code = raw.split(";")[0].trim();
        if (!code) continue;
        const words = code.match(/([A-Za-z])([-+]?[0-9]*\.?[0-9]+)/g);
        if (!words) continue;
        const g = words[0].toUpperCase();
        if (g !== "G0" && g !== "G1") continue;
        let nx=x, ny=y, nz=z, ne=null, nf=f, nv=v, nu=u;
        for (const w of words.slice(1)) {
          const k = w[0].toUpperCase(), val = Number(w.slice(1));
          if (k==="X") nx=val; else if (k==="Y") ny=val; else if (k==="Z") nz=val;
          else if (k==="E") ne=val; else if (k==="F") nf=val;
          else if (k==="V"||k==="C") nv=val; else if (k==="U"||k==="B") nu=val;
        }
        const extrude = ne !== null && ne > ePrev + 1e-9;
        if (nx!==null && ny!==null && nz!==null) {
          if (x!==null && y!==null && z!==null) {
            const d = Math.hypot(nx-x, ny-y, nz-z);
            len += d; if (extrude) exLen += d;
          }
          moves.push({ x:nx, y:ny, z:nz, f:nf, v:nv, u:nu, extrude, line: li+1 });
        }
        x=nx; y=ny; z=nz; if (ne!==null) ePrev=ne; f=nf; v=nv; u=nu;
      }
      meta.totalLen = len; meta.exLen = exLen;
      return { moves, meta };
    }

    // Open5x 기계좌표 → 부품좌표 복원 (conical/open5x.py 역기구학의 역)
    function machineToPart(m, tiltDeg, pivot) {
      // 1) 틸트 해제: p1 = Ry(-t)(m + [0,0,d]) - [0,0,d],  t = -tilt (tilt_sign=-1)
      const t = -tiltDeg * Math.PI / 180;
      const ct = Math.cos(-t), st = Math.sin(-t);
      const zd = m.z + pivot;
      const x1 = ct*m.x + st*zd, y1 = m.y, z1 = -st*m.x + ct*zd - pivot;
      // 2) 회전 해제: p = Rz(-v)·p1
      const a = -(m.v || 0) * Math.PI / 180;
      const ca = Math.cos(a), sa = Math.sin(a);
      return { x: ca*x1 - sa*y1, y: sa*x1 + ca*y1, z: z1 };
    }

    function simColorValue(mv, p, mode_, meta) {
      if (mode_ === "z") return p.z;
      if (mode_ === "feed") return mv.f || 0;
      if (mode_ === "v") return mv.v || 0;
      // cone: z + r·tanθ (원뿔 레이어 번호에 해당) — 각도는 메타에서
      const ang = (meta.angle ?? Math.abs(meta.tilt ?? 0)) * Math.PI/180;
      const sgn = meta.direction === "inward" ? -1 : 1;
      return p.z + sgn * Math.hypot(p.x, p.y) * Math.tan(ang);
    }

    function renderSim() {
      if (!sim.moves.length || mode !== "gcode") return;
      const upto = Math.max(1, Math.round(sim.idx));
      const cm = colorMode.value;
      const restore = sim.is5x && partFrame.checked;
      const pivot = Number(pivotDepth.value) || 50;
      const tilt = Math.abs(sim.meta.tilt ?? sim.meta.angle ?? 0);

      const ex = {x:[],y:[],z:[],c:[]}, tr = {x:[],y:[],z:[]};
      let prev = null; let head = null; let curV = null, curZ = null;
      for (let i = 0; i < upto && i < sim.moves.length; i++) {
        const mv = sim.moves[i];
        const p = restore ? machineToPart(mv, tilt, pivot) : mv;
        if (prev) {
          if (mv.extrude) {
            ex.x.push(prev.x, p.x, null); ex.y.push(prev.y, p.y, null);
            ex.z.push(prev.z, p.z, null);
            const cv = simColorValue(mv, p, cm, sim.meta);
            ex.c.push(cv, cv, cv);
          } else if (showTravel.checked) {
            tr.x.push(prev.x, p.x, null); tr.y.push(prev.y, p.y, null);
            tr.z.push(prev.z, p.z, null);
          }
        }
        prev = p; head = p; curV = mv.v; curZ = p.z;
      }

      const traces = [{
        type:"scatter3d", mode:"lines", x:ex.x, y:ex.y, z:ex.z,
        line:{ width:4, color:ex.c, colorscale:"Viridis", showscale:true,
               colorbar:{ title:{text:colorMode.selectedOptions[0].text}, len:0.6,
                          tickfont:{color:"#eef2ff"} } },
        name:"압출", hoverinfo:"skip" }];
      if (showTravel.checked) traces.push({
        type:"scatter3d", mode:"lines", x:tr.x, y:tr.y, z:tr.z,
        line:{width:1.5, color:"#5a6480"}, name:"이동", hoverinfo:"skip", opacity:0.5 });
      if (showHead.checked && head) traces.push({
        type:"scatter3d", mode:"markers", x:[head.x], y:[head.y], z:[head.z],
        marker:{size:6, color:"#ff8a8a", symbol:"diamond"}, name:"노즐", hoverinfo:"skip" });

      Plotly.react(chart, traces, {
        margin:{l:0,r:0,t:25,b:0}, paper_bgcolor:"#0b1020", plot_bgcolor:"#0b1020",
        font:{color:"#eef2ff"}, showlegend:false,
        scene:{ aspectmode:"data",
          xaxis:{gridcolor:"#33405f",backgroundcolor:"#0b1020"},
          yaxis:{gridcolor:"#33405f",backgroundcolor:"#0b1020"},
          zaxis:{gridcolor:"#33405f",backgroundcolor:"#0b1020"},
          camera:{eye:{x:1.5,y:1.5,z:0.9}} },
        uirevision:"keep-camera" },
        { responsive:true, displaylogo:false, scrollZoom:true });

      const pct = (upto / sim.moves.length * 100);
      progressValue.textContent = `${pct.toFixed(0)}%`;
      const mv = sim.moves[Math.min(upto, sim.moves.length) - 1];
      simStats.textContent =
        `이동 ${upto.toLocaleString()} / ${sim.moves.length.toLocaleString()}  (G-code ${mv.line}행)\n` +
        `압출 경로 ${ (sim.meta.exLen/1000).toFixed(2) } m  · 전체 ${ (sim.meta.totalLen/1000).toFixed(2) } m\n` +
        (sim.meta.angle !== null ? `원뿔: ${sim.meta.direction ?? "?"} ${sim.meta.angle}°\n` : "") +
        (sim.is5x ? `Open5x: 틸트 ${tilt}°  V ${curV === null ? "-" : curV.toFixed(1) + "°"}  ` +
                    `(${restore ? "부품좌표 복원" : "기계좌표 그대로"})\n` : "") +
        (curZ !== null ? `현재 z ${curZ.toFixed(2)} mm` : "");
    }

    function drawEmptyGcodePlot() {
      Plotly.newPlot(chart, [], {
        margin:{l:0,r:0,t:25,b:0}, paper_bgcolor:"#0b1020", plot_bgcolor:"#0b1020",
        font:{color:"#eef2ff"},
        annotations:[{text:"G-code 파일을 선택하세요 (conical_slice.py 출력).",
          showarrow:false, font:{size:18,color:"#aab4d0"}}] },
        { responsive:true, displaylogo:false });
    }

    gcodeFile.addEventListener("change", async () => {
      const file = gcodeFile.files && gcodeFile.files[0];
      if (!file) return;
      try {
        setStatus(`${file.name} 읽는 중...`);
        const text = await file.text();
        const parsed = parseGcodeText(text);
        if (!parsed.moves.length) throw new Error("G0/G1 이동을 찾지 못했습니다.");
        sim.moves = parsed.moves; sim.meta = parsed.meta;
        sim.is5x = parsed.moves.some(m => m.v !== null && m.v !== undefined) &&
                   parsed.meta.tilt !== null;
        sim.idx = parsed.moves.length;
        progress.value = 1000;
        setStatus(`${file.name}: 이동 ${parsed.moves.length.toLocaleString()}개` +
                  (sim.is5x ? " (Open5x 5축)" : " (3축)"));
        renderSim();
      } catch (err) { setStatus(err instanceof Error ? err.message : String(err), "error"); }
    });

    // 재생 루프
    let rafId = null;
    function tick() {
      if (!sim.playing) return;
      sim.idx += Number(playSpeed.value) / 10;
      if (sim.idx >= sim.moves.length) { sim.idx = sim.moves.length; stopPlay(); }
      progress.value = String(Math.round(sim.idx / sim.moves.length * 1000));
      renderSim();
      rafId = requestAnimationFrame(tick);
    }
    function startPlay() {
      if (!sim.moves.length) return;
      if (sim.idx >= sim.moves.length) sim.idx = 1;   // 끝이면 처음부터
      sim.playing = true; playBtn.textContent = "⏸ 정지"; playBtn.classList.add("playing");
      rafId = requestAnimationFrame(tick);
    }
    function stopPlay() {
      sim.playing = false; playBtn.textContent = "▶ 재생"; playBtn.classList.remove("playing");
      if (rafId) cancelAnimationFrame(rafId);
    }
    playBtn.addEventListener("click", () => sim.playing ? stopPlay() : startPlay());
    progress.addEventListener("input", () => {
      stopPlay();
      sim.idx = Math.max(1, Number(progress.value) / 1000 * sim.moves.length);
      renderSim();
    });
    colorMode.addEventListener("change", renderSim);
    showTravel.addEventListener("change", renderSim);
    showHead.addEventListener("change", renderSim);
    partFrame.addEventListener("change", renderSim);
    pivotDepth.addEventListener("change", renderSim);

    drawEmptyPlot();
  </script>
</body>
</html>
